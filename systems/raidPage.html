<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غزو المملكة — ساحة القتال</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060c;--ink:#f4efe6;--dim:#b3abc0;--accent:#ff8a3d;--panel:rgba(9,7,16,.74);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;overflow:hidden;position:relative}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels,#tags,#hud{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#hud>*{pointer-events:auto}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:11px;line-height:1.3;text-shadow:0 1px 3px #000;white-space:nowrap;transition:opacity .4s}
.tag b{display:block;font-weight:700}.tag span{color:var(--dim)}
.tag .hb{width:62px;height:5px;background:#0009;margin:3px auto 0;outline:1px solid #fff3}
.tag .hb u{display:block;height:100%;background:linear-gradient(90deg,#2fd27a,#d4ff6b);transition:width .4s}
.tag.act b{color:var(--accent)}.tag.out{opacity:.3}
.pop{position:absolute;font:700 22px "Reem Kufi",sans-serif;animation:pop 1.25s ease-out forwards;text-shadow:0 2px 8px #000;white-space:nowrap}
.pop.hit{color:#ffe27a;font-size:30px}.pop.crit{color:#ff9a3d;font-size:42px}.pop.me{color:#ff5a5a;font-size:26px}.pop.dead{color:#fff}.pop.heal{color:#6dff9a}.pop.dodge{color:#7fe7ff}.pop.fx{color:#cbb8ff;font-size:18px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,12px) scale(.5)}12%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-84px) scale(1)}}
#boss{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:min(760px,94vw);padding:10px 22px 12px;background:linear-gradient(180deg,var(--panel),rgba(9,7,16,.35));clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,18px 100%);text-align:center}
#boss h1{margin:0;font:700 clamp(22px,4.4vw,38px)/1.1 "Reem Kufi",sans-serif;text-shadow:0 0 22px var(--accent)}
#bSub{font-size:13px;color:var(--dim);margin:2px 0 7px}
#bSub i{font-style:normal;color:var(--accent);font-weight:700;margin-inline-start:6px}
.hpw{position:relative;height:16px;background:#000a;outline:1px solid #fff3;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,7px 100%)}
.hpw div{position:absolute;inset:0 auto 0 0;width:100%}
#hpBack{background:#fff;opacity:.85;transition:width 1s .45s}
#hpFill{background:linear-gradient(90deg,#b3121f,var(--accent));transition:width .35s}
.hpt{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:var(--dim)}
#phase{color:var(--ink);font-weight:700}
#board{position:absolute;top:calc(env(safe-area-inset-top,0px) + 108px);left:10px;width:232px;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(9,7,16,.84),rgba(9,7,16,.5));backdrop-filter:blur(8px);border:1px solid #ffffff18;border-left:3px solid var(--accent);user-select:none}
#bh{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;font:700 15px "Reem Kufi",sans-serif}
#bh small{font:400 11px Tajawal;color:var(--dim);margin-inline-start:auto}
#chev{font-style:normal;color:var(--dim);transition:transform .25s}#board.min #chev{transform:rotate(90deg)}
#me{padding:0 11px 9px;display:grid;grid-template-columns:auto 1fr;gap:2px 11px;align-items:end}
#me .rkb{grid-row:span 2;font:700 40px/1 "Reem Kufi",sans-serif;color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 60%,transparent)}
#me .rkb sup{font-size:15px;color:var(--dim);vertical-align:top;margin-inline-end:2px}
#me .dv{font:700 21px/1 Tajawal;font-variant-numeric:tabular-nums}
#me .sh{font-size:11px;color:var(--dim)}
#me .gap{grid-column:1/-1;font-size:11px;color:var(--dim);margin-top:5px;border-top:1px solid #ffffff14;padding-top:5px}
#me .gap b{color:#ff9a8a}#me .gap b.ok{color:#8dff9f}
#list{position:relative}
.rw{position:absolute;left:0;right:0;height:var(--rh,28px);display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;padding:0 11px;font-size:12.5px;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s;background:linear-gradient(270deg,color-mix(in srgb,var(--accent) 26%,transparent) var(--w,0%),transparent var(--w,0%));border-top:1px solid #ffffff0d;white-space:nowrap}
.rw.you{color:var(--accent);font-weight:700}.rw.out{opacity:.4}.rw.out b{text-decoration:line-through}
.rk{color:var(--dim);font-weight:700;text-align:center}.dm{font-weight:700;font-variant-numeric:tabular-nums;text-align:left;position:relative}
.dm small{position:absolute;left:0;top:-9px;font-size:10px;color:#9dffb8;animation:dl 1.6s ease-out forwards;pointer-events:none}
@keyframes dl{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.rw.up{animation:up 1s ease-out}@keyframes up{0%{background-color:#ffffff40}100%{background-color:transparent}}
#sum{padding:6px 11px;font-size:11px;color:var(--dim);border-top:1px solid #ffffff14}
#board.min #list,#board.min #sum{display:none}
.pop.sm{font-size:19px}
#log{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 124px);width:min(300px,44vw);font-size:12px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
#log div{background:#0009;padding:4px 9px;border-inline-start:2px solid var(--accent);text-shadow:0 1px 2px #000}
#log div:nth-child(n+3){opacity:.55}#log div:nth-child(n+5){opacity:.3}#log div:nth-child(n+6){display:none}
#swap{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);transform:translateX(-50%);display:none;align-items:center;gap:16px;padding:9px 22px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid #ffffff30;pointer-events:none;white-space:nowrap;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,12px 100%)}
#swap.go{display:flex;animation:sw 2.8s ease-out forwards}
#swap small{display:block;font-size:11px;color:var(--dim)}#swap b{font:700 17px "Reem Kufi",sans-serif}
#swap .o b{color:#ff6a6a;text-decoration:line-through}#swap .o small{color:#ff8a8a}#swap .n b{color:#8dff9f}#swap .n small{color:#9dffb8}#swap .ar{font-size:24px;color:var(--accent)}
#swap .hb{width:100%;height:4px;background:#0009;margin-top:3px;outline:1px solid #fff3}#swap .hb u{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2fd27a,#d4ff6b)}
#swap.you{border-color:var(--accent);box-shadow:0 0 28px #ff8a3d66;padding:13px 30px}#swap.you b{font-size:24px}
@keyframes sw{0%{opacity:0;transform:translate(-50%,24px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1.04)}16%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
#banner{position:absolute;left:0;right:0;top:27%;text-align:center;font:700 clamp(30px,7.5vw,76px)/1.1 "Reem Kufi",sans-serif;color:#fff;text-shadow:0 0 30px var(--accent),0 4px 0 #0008;opacity:0;pointer-events:none}
#banner.go{animation:ban 1.7s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.6);letter-spacing:.2em}14%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;justify-content:center;align-items:center;padding:0 10px}
#bar button,#bar select{background:var(--panel);border:1px solid #ffffff30;padding:9px 13px;backdrop-filter:blur(8px)}
#bar select{max-width:34vw}
#atk{position:relative;overflow:hidden;min-width:132px;padding:13px 26px!important;font:700 22px "Reem Kufi",sans-serif!important;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000))!important;color:#160a02;border:0!important;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
#atk::after{content:"";position:absolute;inset:0;background:#000a;transform-origin:right;transform:scaleX(var(--cd,0));transition:transform .1s linear}
#atk:disabled{filter:grayscale(.6);cursor:not-allowed}
#tg{display:none}
#intro,#end{position:absolute;inset:0;display:none;align-items:center;padding:0 7vw;pointer-events:auto}
#intro{background:linear-gradient(270deg,#000d 15%,#0000 85%);pointer-events:none}
#intro.show{display:flex;animation:fi .5s}
#intro h2{margin:0;font:700 clamp(46px,12vw,150px)/1 "Reem Kufi",sans-serif;text-shadow:0 0 50px var(--accent)}
#intro p{margin:8px 0 0;font-size:clamp(15px,2.4vw,24px);color:var(--dim)}#intro p b{color:var(--accent)}
#end{background:#000c;backdrop-filter:blur(4px);justify-content:center;overflow:auto}
#end.show{display:flex;animation:fi .8s}
@keyframes fi{from{opacity:0}}
.ec{width:min(620px,100%);padding:22px 0}
.ec h2{margin:0;font:700 clamp(34px,7vw,64px)/1.1 "Reem Kufi",sans-serif;color:var(--accent);text-shadow:0 0 30px var(--accent)}
.ec>p{color:var(--dim);margin:4px 0 14px}
.ec ol{list-style:none;margin:0 0 16px;padding:0}
.ec li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:8px 10px;border-top:1px solid #ffffff22;font-size:14px}
.ec li:nth-child(-n+3){font-size:16px;background:linear-gradient(270deg,color-mix(in srgb,var(--accent) 22%,transparent),transparent)}
.ec li small{display:block;color:var(--dim);font-size:12px}
.ec .bt{display:flex;gap:10px}.ec button{background:var(--accent);color:#160a02;border:0;padding:11px 22px;font:700 17px "Reem Kufi",sans-serif}.ec button.g{background:#fff2;color:var(--ink)}
.rwc{text-align:center;padding:26px 18px;border:1px solid var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 20%,#0b0912),#0b0912);box-shadow:0 0 50px color-mix(in srgb,var(--accent) 45%,transparent);animation:rwp .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes rwp{from{transform:scale(.7);opacity:0}}
.rwc h2{font-size:clamp(28px,6vw,46px)}
.rwc .it{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.rwc .it div{background:#ffffff14;border:1px solid #ffffff2a;padding:10px 16px;font-size:16px;min-width:120px}
.rwc .it small{display:block;color:var(--dim);font-size:11px;margin-bottom:3px}
.rwc .it .sp{border-color:gold;color:gold}
.rwc .bt{justify-content:center}
#nogl{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px}
@media(max-width:720px){#bar{gap:5px;padding:0 6px}#bar select{max-width:24vw}#log div:nth-child(n+4){display:none}#board{top:calc(env(safe-area-inset-top,0px) + 98px);left:5px;width:142px;background:rgba(9,7,16,.62)}#bh{padding:5px 8px;font-size:12px}#bh{white-space:nowrap}#bh small{display:none}#me{padding:0 8px 6px;gap:1px 8px}#me .rkb{font-size:28px}#me .rkb sup{font-size:11px}#me .dv{font-size:14px}#me .sh{font-size:9px}#me .gap,#sum{display:none}.rw{font-size:10.5px;padding:0 8px;grid-template-columns:14px 1fr auto;gap:4px}.dm small{font-size:8px;top:-7px}.pl{display:none}#swap{gap:9px;padding:7px 12px}#swap b{font-size:13px}#swap.you b{font-size:16px}#swap small{font-size:9px}#log{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);left:6px;right:auto;width:46vw;font-size:10.5px;flex-direction:column-reverse}#bar button,#bar select{padding:7px 7px;font-size:12px}#atk{min-width:78px;padding:10px 12px!important;font-size:18px!important}.tag{font-size:10px}.tag .hb{width:46px}}
@media(prefers-reduced-motion:reduce){#banner.go{animation-duration:.01s;animation-delay:1s}}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="tags"></div><div id="labels"></div>
<div id="hud">
 <header id="boss"><h1 id="bName"></h1><div id="bSub"></div>
  <div class="hpw"><div id="hpBack"></div><div id="hpFill"></div></div>
  <div class="hpt"><span id="phase"></span><span id="hpTxt"></span></div></header>
 <aside id="board"><div id="bh"><b>⚔ عداد الضرر</b><small id="cnt"></small><i id="chev">▾</i></div><div id="me"></div><div id="list"></div><div id="sum"></div></aside>
 <div id="log"></div><div id="swap"></div><div id="banner"></div>
 <footer id="bar"><button id="tg">المشاركون</button><button id="atk">هجوم</button><button id="spd" title="سرعة المعركة">×1</button></footer>
</div>
<div id="intro"></div><div id="end"></div>

const api=async(url,body)=>{try{const o=body?{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({...body,csrf:D.csrf})}:{credentials:'same-origin',cache:'no-store'};const r=await fetch(url,o);return await r.json()}catch(e){return{ok:false,code:'NET',message:'تعذّر الاتصال بالخادم'}}};
let busy=false,QD=[],tgt=null;const CDS=(D.cdTotal||30000)/1000;

/* الصور الحقيقية للشخصيات والزعيم (مع حواف ناعمة لأن صور البوت بخلفيات) */
function loadImg(u){return new Promise(r=>{if(!u)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u})}
function feather(i,mh){const s=Math.min(1,mh/i.height),w=Math.max(2,Math.round(i.width*s)),h=Math.max(2,Math.round(i.height*s)),c=cv2(w,h),x=c.getContext('2d');x.drawImage(i,0,0,w,h);x.globalCompositeOperation='destination-in';x.save();x.translate(w/2,h/2);x.scale(w/h,1);const r=h/2,g=x.createRadialGradient(0,0,r*.58,0,0,r);g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(-w,-h,w*2,h*2);x.restore();return c}
async function ensureSprite(c){if(IM[c.k])return;const i=await loadImg(c.img);IM[c.k]=i?variants(prep(feather(i,640),true)):IM[c.fb]}
async function bossSprite(i){const im=await loadImg(D.raid.bossImage);if(im)return variants(feather(im,900));
 if(i===0)return IM.shanks;const s=IM.shanks.n,c=cv2(s.width,s.height),x=c.getContext('2d');x.drawImage(s,0,0);x.globalCompositeOperation='source-atop';x.fillStyle=TH[i][4];x.globalAlpha=.3;x.fillRect(0,0,c.width,c.height);return variants(c)}

/* هجومي — الخادم يشغّل attackRaid() الحقيقي ويرجع النتيجة */
async function myAttack(my){
 busy=true;
 try{
  const res=await api('/raid/attack',{});if(my!==rid)return;
  if(!res.ok){
   if(res.code==='COOLDOWN')you.nextAt=Date.now()+(res.retryInMs||1000);
   else if(res.code==='DEAD'){you.chars.forEach(c=>c.dead=true);you.out=true;setTag(you);updateBoard();banner('سقطت جميع شخصياتك')}
   else if(res.code==='NO_RAID'){const s=await api('/raid/state');if(s&&s.ok&&!s.active)await raidOver(s)}
   else log('⚠️ '+cn(res.message||'تعذّر تنفيذ الهجوم'));
   return}
  await applyAttack(res,my)
 }finally{busy=false}}
async function applyAttack(res,my){
 const p=you,h=res.hit;p.nextAt=Date.now()+(res.cdMs||CDS*1000);
 R.hp=Math.max(0,R.hp-h.dmg);R.total+=h.dmg;p.dmg+=h.dmg;p.srv=Math.max(p.srv,p.dmg);p.hits++;
 if(h.heal&&R.hp>0)R.hp=Math.min(R.max,R.hp+h.heal);
 const ac=alive(p);
 if(h.reflect&&ac){ac.hp-=h.reflect;if(ac.hp<=0){ac.hp=0;ac.dead=true}}
 const r={dmg:h.dmg,crit:h.crit,tags:h.tags,best:h.best,absorbed:h.absorbed,reflect:h.reflect,heal:h.heal,reflectKill:!!(ac&&ac.dead)};
 await playerAnim(p,r);if(my!==rid)return;
 const ph=phaseOf(R);if(ph>R.ph&&R.hp>0){R.ph=ph;await phaseFx(ph);updateBoss()}
 if(res.bossDead){R.hp=0;await bossDeath(res.end);return}
 R.hp=res.raid.hp;R.total=Math.max(R.total,res.raid.total);updateBoss();
 if(r.reflectKill)await killSeq(p);if(my!==rid)return;if(done){await defeat();return}
 if(!p.out&&res.boss){
  const bo=res.boss,c=p.chars[bo.ci];
  if(c){
   const b={dmg:bo.dmg,c,died:bo.died,out:bo.out,ab:bo.ab,crit:bo.crit,tags:[],dot:bo.dot,bheal:0,dodged:bo.dodged};
   if(!bo.dodged){if(bo.died){c.hp=0;c.dead=true}else c.hp=bo.hpAfter}
   await bossAnim(p,b);if(my!==rid)return;if(done){await defeat();return}}}
 res.chars.forEach((s,i)=>{const c=p.chars[i];if(c){c.hp=s.hp;c.dead=s.dead}});setTag(p);updateBoard()}

async function othersHit(q,my){
 if(q.sk){you.skq=false;if(you.e&&!you.out)await killSeq(you);return}
 const p=q.p;if(!P.includes(p))return;
 R.hp=Math.max(0,R.hp-q.d);R.total+=q.d;p.dmg+=q.d;p.hits++;
 const r={dmg:q.d,crit:false,tags:[],best:1,heal:0};
 await quickHit(p,r);if(my!==rid)return;
 const ph=phaseOf(R);if(ph>R.ph&&R.hp>0){R.ph=ph;await phaseFx(ph);updateBoss()}
 if(!QD.length&&tgt){R.hp=tgt.hp;R.total=Math.max(R.total,tgt.total);updateBoss();updateBoard()}}
function syncState(s){
 const rr=s.raid;R.max=rr.max;let ch=false;
 for(const b of s.board){
  let p=P.find(q=>q.id===b.id);
  if(!p){
   if(P.length<8){p=mkOther(b);P.push(p);ch=true;log(`➕ انضم <b>${p.name}</b>`)}
   else{const w=P.filter(q=>!q.isYou).sort((x,y)=>x.dmg-y.dmg)[0];if(w&&b.dmg>w.dmg){P.splice(P.indexOf(w),1);p=mkOther(b);P.push(p);ch=true}}
   continue}
  if(b.out&&!p.out){p.out=true;ch=true;log(`🏴 انتهت مشاركة <b>${p.name}</b>`)}
  if(b.cn)p.shown.name=cn(b.cn);
  if(b.dmg>p.srv){QD.push({p,d:b.dmg-p.srv});p.srv=b.dmg}}
 const m=s.me;if(m.dmg>you.dmg){you.dmg=m.dmg;you.srv=m.dmg}
 m.chars.forEach((c,i)=>{const x=you.chars[i];if(x){x.hp=c.hp;x.dead=c.dead}});
 if(!you.out&&!you.skq&&(!alive(you)||(you.shown&&you.shown.dead))){you.skq=true;QD.push({sk:true})}
 you.nextAt=Math.max(you.nextAt,Date.now()+(m.cdMs||0));
 tgt={hp:rr.hp,total:rr.total};
 if(!QD.length){R.hp=rr.hp;R.total=Math.max(0,rr.total);updateBoss()}
 if(ch){layout();buildBoard()}updateBoard()}
async function pollLoop(my){
 while(my===rid&&!done){
  await sleep(document.hidden?8000:3000);if(my!==rid||done)return;if(busy)continue;
  const s=await api('/raid/state');if(my!==rid||done||busy||!s||!s.ok)continue;
  if(!s.active){await raidOver(s);return}
  syncState(s)}}
async function raidOver(s){
 if(done)return;
 const last=s&&s.last&&s.last.ts>=D.loadedAt?s.last:null;
 if(last&&last.win){R.hp=0;await bossDeath(last);return}
 if(s&&s.killed){R.hp=0;await bossDeath(null);return}
 done=true;await defeat()}
async function battle(my){
 while(my===rid&&!done){
  if(want&&!you.out&&Date.now()>=you.nextAt){want=false;await myAttack(my);continue}
  if(QD.length){await othersHit(QD.shift(),my);continue}
  await wait(.1)}}
function showEnd(win,data){
 const medal=['🥇','🥈','🥉'];let rows;
 if(data&&data.rows&&data.rows.length){
  rows=data.rows.map((p,i)=>{const bx=[p.chance?`SSS Chance ×${p.chance}`:'',p.high?`SSS High ×${p.high}`:''].filter(Boolean).join(' · ')||'بدون صناديق';
   return`<li><span>${medal[i]||i+1}</span><span><b>${cn(p.name)}${p.id&&p.id===you.id?' ★':''}</b><small>💰 ${full(p.money)} · ${bx}${p.character?` · 🌟 شخصية SSS: ${cn(p.character)}`:''}</small></span><b>${fmt(p.dmg)}</b></li>`}).join('')}
 else{const L=[...P].filter(p=>p.dmg>0).sort((a,b)=>b.dmg-a.dmg);
  rows=L.map((p,i)=>`<li><span>${medal[i]||i+1}</span><span><b>${p.name}${p.isYou?' ★':''}</b><small>${win?'الجوائز أُرسلت في القروب':p.hits+' ضربة'}</small></span><b>${fmt(p.dmg)}</b></li>`).join('')}
 const board=()=>{$('#end').innerHTML=`<div class="ec"><h2>${win?'تم تحرير المملكة':'سقطت المملكة'}</h2><p>${R.k.name} · ${R.k.boss} ${win?'هُزم':'انتصر عليكم'}</p><ol>${rows}</ol><div class="bt"><button id="e1">العودة</button></div></div>`;$('#e1').onclick=()=>location.reload()};
 // جائزتي: تظهر فوق الشاشة أولاً مع زر "جمع"
 const mine=win&&data&&data.rows&&you?data.rows.find(p=>p.id&&p.id===you.id):null;
 if(mine){
  const rk=data.rows.indexOf(mine);
  $('#end').innerHTML=`<div class="ec"><div class="rwc"><h2>🏆 جوائزك</h2><p>${medal[rk]||'🎖️'} المركز ${rk+1} · ضرر ${fmt(mine.dmg)}</p><div class="it"><div><small>💰 المال</small><b>${full(mine.money)}</b></div>${mine.character?`<div class="sp"><small>🌟 شخصية SSS</small><b>${cn(mine.character)}</b></div>`:''}${mine.chance?`<div><small>🎁 SSS Chance</small><b>×${mine.chance}</b></div>`:''}${mine.high?`<div><small>🎁 SSS High</small><b>×${mine.high}</b></div>`:''}</div><div class="bt"><button id="e0">جمع الجوائز</button></div></div></div>`;
  $('#end').classList.add('show');$('#e0').onclick=board;return}
 board();$('#end').classList.add('show')}

async function startRaid(){
 await loaded;const my=++rid;tws.length=0;sparks.length=rings.length=slashes.length=pillars.length=beams.length=0;orb=null;warn=null;dread=0;done=false;want=false;force=false;GT=0;curP=null;shake=0;zoomP=0;flashS=0;busy=false;QD=[];tgt=null;
 $('#end').classList.remove('show');$('#log').innerHTML='';$('#labels').innerHTML='';
 const rr=D.raid,i=rr.theme;KI=i;
 K0={name:cn(rr.name),anime:cn(rr.anime),boss:cn(rr.boss),diff:rr.diff,rm:rr.rm,passive:rr.passive,pv:rr.pv};
 R={k:K0,hp:rr.hp,max:rr.max,pass:rr.passive,pv:rr.pv,total:rr.total,hits:0,ph:1};R.ph=phaseOf(R);
 Object.assign(B,{ox:0,oy:0,sc:1,rot:0,a:1,fl:0,fr:0,dis:1,rage:R.ph>1?(R.ph==2?.6:1):0,ph:Math.random()*6,trail:[],dash:false,hov:0});
 bossV=await bossSprite(i);if(my!==rid)return;
 makeParticipants();renderWorld();
 $('#bName').textContent=K0.boss;$('#bSub').innerHTML=`${K0.name} · ${K0.anime}<i>${PASS[K0.passive]||''} ${K0.pv}%</i><i>الصعوبة ${K0.diff}/10</i><i id="rt"></i>`;
 // عداد الوقت المتبقي للرايد
 clearInterval(window.__rt);const rt=$('#rt'),endAt=Number(rr.endsAt)||0;
 if(rt&&endAt>0){const t=()=>{const s=Math.max(0,Math.floor((endAt-Date.now())/1000));rt.textContent='⏳ '+[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':');rt.style.color=s<600?'#ff5a5a':'';if(s<=0&&window.__rt){clearInterval(window.__rt)}};t();window.__rt=setInterval(t,1000)}else if(rt)rt.style.display='none';
 updateBoss();updateBoard();P.forEach(setTag);
 if(you.shown)ensureSprite(you.shown);
 $('#intro').innerHTML=`<div><p>${K0.anime}</p><h2>${K0.name}</h2><p>الزعيم <b>${K0.boss}</b> · الصعوبة ${K0.diff}/10 · ${PASS[K0.passive]||''}</p></div>`;$('#intro').classList.add('show');
 introK=0;tw(3,k=>introK=k);tw(2.3,k=>{B.dis=1-k;if(Math.random()<.5)spark(B.x+rnd(-B.h*.3,B.h*.3),B.y-rnd(0,B.h),TH[i][4],2,260,.8,-120)},ez.o);
 setTimeout(()=>ring(B.x,B.y,TH[i][4],B.h*1.1,1.2),900);
 await sleep(2600);if(my!==rid)return;
 $('#intro').classList.remove('show');shake=20;flashS=.6;flashC=TH[i][4];B.dis=0;
 if(you.shown){await summon(you,you.shown);if(my!==rid)return}else{setTag(you);banner('سقطت جميع شخصياتك')}
 updateBoard();battle(my);pollLoop(my)}

/* لا يوجد غزو نشط: شاشة انتظار بعدّاد الغزو القادم */
async function waiting(){
 await loaded;KI=0;bossV=IM.shanks;B.dis=1;B.trail=[];renderWorld();
 const nx=D.nextAt||0,tick=()=>{const s=Math.max(0,Math.floor((nx-Date.now())/1000));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')};
 $('#bName').textContent='لا يوجد غزو نشط';$('#bSub').textContent='انتظر إعلان الغزو القادم';$('#hpTxt').textContent='';$('#phase').textContent='';
 $('#end').innerHTML=`<div class="ec"><h2>لا يوجد غزو نشط</h2><p>الغزو القادم بعد <b id="cdn">${tick()}</b></p><div class="bt"><button id="e1">تحديث</button></div></div>`;
 $('#end').classList.add('show');$('#e1').onclick=()=>location.reload();
 setInterval(()=>{const e=$('#cdn');if(e)e.textContent=tick()},1000);
 setInterval(async()=>{const s=await api('/raid/state');if(s&&s.ok&&s.active)location.reload()},8000)}

/* التحكم */
$('#spd').onclick=()=>{SP=SP===1?2:SP===2?3:1;$('#spd').textContent='×'+SP};
$('#bh').onclick=()=>$('#board').classList.toggle('min');if(innerWidth<720)$('#board').classList.add('min');
const atk=$('#atk');function doAtk(){if(!done&&you&&!you.out&&Date.now()>=you.nextAt&&introK>=1&&!busy)want=true}
atk.onclick=doAtk;addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='SELECT'){e.preventDefault();doAtk()}});
setInterval(()=>{if(!you)return;const cd=Math.max(0,(you.nextAt-Date.now())/1000),off=you.out||done||introK<1||want||busy;atk.disabled=off||cd>0;atk.style.setProperty('--cd',you.out?1:Math.min(1,cd/CDS));atk.textContent=you.out?'سقطت':cd>0&&!off?cd.toFixed(1):'هجوم'},100);
resize();if(D.active)startRaid();else waiting();requestAnimationFrame(frame);
</script></body></html>
