<div class="tw" style="padding:30px 16px 190px">
  {{TOP}}
<style>
.tw-w{max-width:520px;margin:0 auto}

.tw-st small{display:block;font-size:11px;color:var(--text-dim);font-weight:600}
.tw-cam{position:relative;height:320px;overflow:hidden;border-radius:18px;border:1px solid #1d2540;background:radial-gradient(1px 1px at 20% 30%,#fff9,transparent),radial-gradient(1.5px 1.5px at 75% 18%,#fff8,transparent),radial-gradient(1px 1px at 60% 70%,#fff6,transparent),linear-gradient(#0c1030,#161235 60%,#2a1a3d);-webkit-mask-image:linear-gradient(#0000,#000 12%,#000 88%,#0000);mask-image:linear-gradient(#0000,#000 12%,#000 88%,#0000)}
#tw-tower{position:relative;width:100%}

#tw-tower::after{content:"";position:absolute;left:0;right:0;bottom:-90px;height:90px;background:linear-gradient(#1b1630,#0a0d16)}
.tw-fl{height:64px;display:flex;align-items:center;justify-content:center}
.tw-blk{width:240px;height:56px;border-radius:8px;background:linear-gradient(#1c2340,#12182c);border:1px solid #27304f;display:flex;align-items:center;justify-content:space-between;padding:0 10px;transition:.6s}

.tw-w6{display:flex;gap:6px}.tw-w6 u{width:10px;height:16px;border-radius:3px;background:#2b3558;transition:.6s}

.tw-cur .tw-blk em{background:var(--gold);color:#0a0d16}.tw-cur .tw-w6 u{background:var(--gold);box-shadow:0 0 8px var(--gold)}
@keyframes twp{50%{box-shadow:0 0 12px #f0c04a44}}
.tw-sec{font:800 15px 'Cairo',sans-serif;color:var(--gold);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.tw-tools{display:flex;gap:8px;margin-bottom:8px}
.tw-tools input{flex:1;min-width:0;font:600 14px 'Cairo',sans-serif;padding:9px 12px;border-radius:12px;border:1px solid #222c4a;background:#0f1422;color:var(--text)}
.tw-tools button,.tw-seg button{font:800 13px 'Cairo',sans-serif;padding:7px 12px;border-radius:20px;border:1px solid var(--gold-dim);background:#0f1422;color:var(--gold);cursor:pointer}
.tw-tools button.on,.tw-seg button.on{background:var(--gold);color:#0a0d16}
#tw-roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tw-ch{position:relative;font:800 13px 'Cairo',sans-serif;color:var(--text);background:#0f1422;border:1.5px solid #222c4a;border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:100px}
.tw-av{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,#5b3fd1,#c0539b);border:2px solid var(--tc,#8b93a1);overflow:hidden}

.tw-ch span.nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tw-ch small{color:var(--text-dim);font-size:12px;direction:ltr}
.tw-ch i{position:absolute;top:5px;left:6px;font:700 10px 'Oswald',sans-serif;color:var(--text-dim);font-style:normal;direction:ltr}

.tw-ch.s{border-color:var(--gold);box-shadow:0 0 14px #f0c04a55}.tw-ch.s b{display:grid}
.tw-ch.u{opacity:.35;cursor:default}
.tw-more{display:block;width:100%;margin-top:10px;font:800 14px 'Cairo',sans-serif;padding:10px;border-radius:12px;border:1px solid #222c4a;background:#0f1422;color:var(--text-dim);cursor:pointer}
.tw-empty{grid-column:1/-1;text-align:center;color:var(--text-dim);padding:26px 8px;line-height:2}
#tw-bar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;z-index:45;background:rgba(10,13,22,.96);border:1px solid var(--gold-dim);border-radius:18px;padding:10px;box-shadow:0 8px 30px #000a;transform:translateY(160%);transition:transform .3s;visibility:hidden}

.tw-br{display:flex;gap:6px;align-items:center;justify-content:space-between}
.tw-seg{display:flex;gap:6px}

#tw-go{display:block;width:100%;margin-top:8px;font:900 18px 'Cairo',sans-serif;padding:12px;border-radius:14px;border:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold));color:#0a0d16;cursor:pointer}

#tw-fight.on{display:flex}#tw-fight.boss{background:radial-gradient(circle at 50% 40%,#4a2d12,#07090f 70%)}
.tw-rays{position:absolute;width:170vmax;height:170vmax;background:repeating-conic-gradient(#f0c04a24 0 6deg,transparent 6deg 18deg);animation:tws 14s linear infinite;-webkit-mask-image:radial-gradient(circle,#000,transparent 50%);mask-image:radial-gradient(circle,#000,transparent 50%)}
@keyframes tws{to{transform:rotate(360deg)}}
#tw-fT{position:relative;font:900 26px 'Cairo',sans-serif;color:var(--gold)}
#tw-bc{position:relative;width:min(70vw,280px);aspect-ratio:3/4;border-radius:18px;border:3px solid var(--gold);overflow:hidden;box-shadow:0 0 60px #f0c04a66;background:linear-gradient(#2a1d4d,#0b0e1a)}
#tw-bc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tw-fb{position:absolute;inset:0;display:grid;place-items:center;font-size:96px}
.tw-slash{position:absolute;inset:0;background:linear-gradient(115deg,transparent 44%,#fff 50%,transparent 56%);opacity:0}
#tw-bc.slam{animation:twslam .8s cubic-bezier(.2,.8,.3,1)}
@keyframes twslam{0%{transform:scale(1.9) translateY(-60px);opacity:0}55%{opacity:1;transform:scale(.95)}100%{transform:none}}
#tw-bc.hit{animation:twhit .55s}#tw-bc.hit .tw-slash{animation:twsl .45s}
@keyframes twhit{20%{transform:translateX(-12px) rotate(-2deg);filter:brightness(2.4) saturate(0)}40%{transform:translateX(12px)}60%{transform:translateX(-7px)}}
@keyframes twsl{0%{opacity:1;transform:translateX(100%)}100%{opacity:0;transform:translateX(-100%)}}
#tw-stamp{position:absolute;top:44%;font:900 36px 'Cairo',sans-serif;padding:2px 18px;border:4px solid;border-radius:10px;transform:rotate(-9deg);display:none;background:#0a0d16cc}
#tw-stamp.in{display:block;animation:twst .4s cubic-bezier(.2,1.4,.4,1)}
#tw-stamp.ok{color:#4ade80}#tw-stamp.bad{color:#ff5d5d}
@keyframes twst{0%{transform:scale(2.6) rotate(-9deg);opacity:0}100%{transform:scale(1) rotate(-9deg)}}
#tw-fP{position:relative;font:800 15px 'Cairo',sans-serif;text-align:center;padding:0 12px}#tw-fP b{color:var(--gold)}
#tw-chips{position:relative;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:32px;padding:0 14px}
#tw-chips span{background:#0a0d16cc;border:1px solid var(--gold-dim);border-radius:20px;padding:3px 12px;font:800 13px 'Cairo',sans-serif;animation:twpop .4s backwards}
@keyframes twpop{from{transform:scale(0)}}
#tw-skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;font:700 13px 'Cairo',sans-serif;color:var(--text-dim);background:#0a0d16aa;border:1px solid #333;border-radius:20px;padding:5px 14px;cursor:pointer}
#tw-res{position:fixed;inset:0;z-index:101;display:none;background:#05070df2;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 14px 30px}
#tw-res.on{display:block}#tw-res>div{max-width:520px;margin:0 auto}
#tw-res h2{text-align:center;font:900 28px 'Cairo',sans-serif;color:var(--gold)}
#tw-res p{text-align:center;color:var(--text-dim);margin:4px 0 16px;font-weight:600}
.tw-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tw-tl{background:#0f1422;border:1.5px solid #2a6b45;border-radius:14px;padding:10px 12px;animation:twpop .45s backwards;animation-delay:calc(var(--i)*.12s)}
.tw-tl.ms{border-color:var(--gold);box-shadow:0 0 16px #f0c04a44}
.tw-tl b{font-size:22px;color:#4ade80}.tw-tl.ms b{color:var(--gold)}
.tw-tl span{display:block;font-weight:700;font-size:13px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-rc{margin:14px 0;border:2px solid var(--rc,#f0c04a);border-radius:18px;background:linear-gradient(#1a1530,#0f1422);overflow:hidden;box-shadow:0 0 30px #f0c04a55;animation:twpop .6s backwards}
.tw-rc .im{position:relative;height:260px;display:grid;place-items:center;font-size:90px;background:radial-gradient(circle at 50% 30%,#3a2a66,#0b0e1a)}
.tw-rc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tw-rc .bd{padding:12px 14px}
.tw-rc h3{font:900 20px 'Cairo',sans-serif;color:var(--rc,#f0c04a)}
.tw-rc .pw{font:700 13px 'Cairo',sans-serif;color:var(--text-dim);margin-bottom:8px}
.tw-ab{background:#0a0d16;border:1px solid #222c4a;border-radius:12px;padding:8px 10px;margin-top:6px}
.tw-ab b{display:block;font:800 14px 'Cairo',sans-serif;color:var(--gold)}
.tw-ab span{font:600 12px 'Cairo',sans-serif;color:var(--text-dim)}
.tw-tot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.tw-tot span{background:#0f1422;border:1px solid var(--gold-dim);border-radius:20px;padding:5px 14px;font-weight:800}
.tw-err{background:#3a1216;border:1px solid #ff5d5d;border-radius:12px;padding:10px 14px;margin:14px 0;font-weight:700;white-space:pre-line}
#tw-ok{display:block;width:100%;font:900 18px 'Cairo',sans-serif;padding:14px;border-radius:14px;border:0;background:var(--gold);color:#0a0d16;cursor:pointer;margin-top:14px}
#tw-toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#151b2e;border:1px solid #ff6b6b;border-radius:14px;padding:12px 16px;font:700 14px 'Cairo',sans-serif;z-index:110;transition:.25s;max-width:90vw;text-align:center}
#tw-toast.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){.tw-rays,.tw-cur .tw-blk{animation:none}#tw-tower.on{transition:none}}
</style>

<div class="tw-w">
  <div class="tw-st">
    <div><span id="tw-sF">1</span>/60<small>الطابق</small></div>
    <div><span id="tw-sA">0</span>%<small>هجوم إضافي</small></div>
    <div><span id="tw-sT">0</span><small>🎫 تذاكر</small></div>
  </div>
  <div class="tw-cam"><div id="tw-tower"></div></div>

  <div class="tw-sec"><span>شخصياتك</span><small>الرقم الصغير = رقمها بـ .طابق</small></div>
  <div class="tw-tools">
    <input id="tw-q" type="search" placeholder="ابحث باسم الشخصية…" autocomplete="off">
    <button id="tw-hide" class="on" type="button">إخفاء المستعملة</button>
  </div>
  <div id="tw-roster"></div>
  <button class="tw-more" id="tw-more" type="button" hidden>عرض المزيد</button>
</div>

<div id="tw-bar" role="region" aria-label="الصعود">
  <div class="tw-br">
    <div class="tw-seg" id="tw-seg"><button data-n="1" class="on" type="button">1</button><button data-n="2" type="button">2</button><button data-n="5" type="button">5</button><button data-n="10" type="button">10</button></div>
    <button id="tw-clr" type="button">مسح الاختيار</button>
  </div>
  <div id="tw-sum"></div>
  <button id="tw-go" type="button">اصعد</button>
</div>

<div id="tw-fight">
  <div class="tw-rays"></div>
  <button id="tw-skip" type="button">تخطي</button>
  <div id="tw-fT"></div>
  <div id="tw-bc"><div class="tw-fb">👹</div><img id="tw-bimg" alt="" referrerpolicy="no-referrer"><div class="tw-slash"></div><div id="tw-stamp"></div></div>
  <div id="tw-fP"></div>
  <div id="tw-chips"></div>
</div>
<div id="tw-res"><div id="tw-resIn"></div></div>
<div id="tw-toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
var D={{DATA}};
function $(s){return document.querySelector(s)}
function L(n){return Number(n).toLocaleString('en-US')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var F=D.floors,C=D.chars,MS={},PAGE=60,shown=PAGE;
for(var m=5;m<=60;m+=5)MS[m]=1;
var CELL=F[0]&&F[0].i;
var S={floor:D.st.floor,atk:D.st.atk,t:D.st.tickets,done:D.st.completed,used:{},sel:[],n:1,busy:false,fast:false,hide:true,q:''};
D.st.used.forEach(function(n){S.used[n]=1});
function eff(p,atk){return Math.floor(p*(1+(atk==null?S.atk:atk)/100))}
function isUsed(c){return !!S.used[c.rn]}
function word(n){return n>2&&n<11?'طوابق':'طابق'}
function z(ms){return new Promise(function(r){setTimeout(r,S.fast?ms/5:ms)})}
function toast(t){var e=$('#tw-toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},3200)}

function draw(){
  var h='';
  for(var f=60;f>=1;f--){
    var c=f<S.floor?'tw-ok':f===S.floor?'tw-cur':'',m=MS[f]?' tw-ms':'';
    h+='<div class="tw-fl '+c+m+'"><div class="tw-blk"><em>'+f+'</em><span class="tw-w6"><u></u><u></u><u></u></span><small>'+(f===60?'👑 ':m?'⚜ ':'')+L(F[f-1].p)+'</small></div></div>';
  }
  var t=$('#tw-tower');t.innerHTML=h;
  var cf=Math.min(S.floor,60);
  t.style.transform='translateY('+(-(60-cf)*64+320*.58-32)+'px)';
  $('#tw-sF').textContent=cf;$('#tw-sA').textContent=S.atk;$('#tw-sT').textContent=S.t;
}

function roster(){
  var q=S.q.trim().toLowerCase(),list=[];
  for(var i=0;i<C.length;i++){
    var c=C[i];
    if(S.hide&&isUsed(c)&&S.sel.indexOf(i)<0)continue;
    if(q&&c.n.toLowerCase().indexOf(q)<0&&String(c.no)!==q)continue;
    list.push(i);
  }
  var part=list.slice(0,shown),h='';
  part.forEach(function(i){
    var c=C[i],u=isUsed(c),k=S.sel.indexOf(i);
    h+='<button type="button" class="tw-ch'+(u?' u':'')+(k>-1?' s':'')+'" data-i="'+i+'"'+(u?' disabled':'')+' style="--tc:'+esc(c.c||'#8b93a1')+'"><b>'+(k+1)+'</b><i>#'+c.no+'</i><span class="tw-av">'+esc(c.n.charAt(0))+(c.i?'<img loading="lazy" referrerpolicy="no-referrer" alt="" src="'+esc(c.i)+'" onerror="this.remove()">':'')+'</span><span class="nm">'+esc(c.n)+'</span><small>⚔ '+L(eff(c.p))+'</small></button>';
  });
  if(!part.length)h='<div class="tw-empty">'+(C.length?'ما في شخصيات مطابقة 🔍':'ما عندك شخصيات بعد')+'</div>';
  $('#tw-roster').innerHTML=h;
  $('#tw-more').hidden=list.length<=shown;
  bar();
}

function bar(){
  var b=$('#tw-bar'),n=S.sel.length;
  b.classList.toggle('on',!S.busy&&!S.done&&n>0);
  $('#tw-go').textContent=n?'اصعد '+n+' '+word(n):'اختر شخصية للصعود';
  $('#tw-sum').textContent=S.sel.map(function(i,k){return (S.floor+k)+' ← '+C[i].n}).join(' · ');
}

function autoPick(n){
  S.sel=[];var atk=S.atk,pick={};
  for(var k=0;k<n&&S.floor+k<=60;k++){
    var f=S.floor+k,need=F[f-1].p,b=-1;
    for(var j=0;j<C.length;j++){
      if(isUsed(C[j])||pick[j])continue;
      if(eff(C[j].p,atk)>=need&&(b<0||C[j].p<C[b].p))b=j;
    }
    if(b<0)break;
    S.sel.push(b);pick[b]=1;
    if(f<=30)atk+=5;
  }
  roster();
}

function fight(f,d,ok){
  var o=$('#tw-fight'),bc=$('#tw-bc'),im=$('#tw-bimg');
  $('#tw-fT').textContent=MS[f]?'👑 بوس الطابق '+f:'الطابق '+f;
  $('#tw-fP').innerHTML=esc(d.n)+' ⚔ <b>'+L(d.p)+'</b> ← '+L(d.need);
  im.style.display='';im.onerror=function(){im.style.display='none'};im.src=F[f-1].i;
  $('#tw-stamp').className='';$('#tw-chips').innerHTML='';
  bc.className='';void bc.offsetWidth;bc.className='slam';
  o.classList.toggle('boss',!!MS[f]);o.classList.add('on');
  return z(1000).then(function(){bc.className='hit';return z(600)}).then(function(){
    var s=$('#tw-stamp');s.textContent=ok?'تم الاجتياز':'فشل';s.className='in '+(ok?'ok':'bad');
    if(ok){
      var r=d.r,a=[];
      if(r.money)a.push('💰 +'+L(r.money));if(r.xp)a.push('⭐ +'+L(r.xp));if(r.draws)a.push('🎫 +'+r.draws);if(r.box)a.push('🎁 '+esc(r.box));if(f===60)a.push('🌟 شخصية SSS');if(f===60)a.push('📦 +5 سعة المخزون');if(f===60)a.push('⚔️ +10% هجوم');
      $('#tw-chips').innerHTML=a.map(function(t,i){return '<span style="animation-delay:'+(i*.12)+'s">'+t+'</span>'}).join('');
    }
    return z(1400);
  }).then(function(){o.classList.remove('on');return z(250)});
}

function showRes(done,stop,win){
  var T={money:0,xp:0,draws:0,boxes:[]};
  done.forEach(function(d){T.money+=d.r.money;T.xp+=d.r.xp;T.draws+=d.r.draws;if(d.r.box)T.boxes.push(d.r.box)});
  var rc=null;done.forEach(function(d){if(d.rc)rc=d.rc});
  var rch=rc?'<div class="tw-rc" style="--rc:'+esc(rc.c||'#f0c04a')+'"><div class="im">🌟'+(rc.i?'<img referrerpolicy="no-referrer" alt="" src="'+esc(rc.i)+'" onerror="this.remove()">':'')+'</div><div class="bd"><h3>'+esc(rc.n)+' · '+esc(rc.r)+'</h3><div class="pw">⚔ '+L(rc.p)+' · ✨ قدرات UR ×'+rc.ab.length+'</div>'+rc.ab.map(function(a){return '<div class="tw-ab"><b>'+esc(a.n)+'</b><span>'+esc(a.d)+'</span></div>'}).join('')+'</div></div>':'';
  var tot=[];
  if(T.money)tot.push('💰 '+L(T.money));if(T.xp)tot.push('⭐ '+L(T.xp));if(T.draws)tot.push('🎫 '+T.draws);
  T.boxes.forEach(function(b){tot.push('🎁 '+esc(b))});
  if(done.some(function(d){return d.f===60}))tot.push('📦 +5 سعة المخزون','⚔️ +10% هجوم');
  if(win)tot.push('⚜️ سيد العروش');
  $('#tw-resIn').innerHTML='<h2>'+(win?'👑 سيد العروش':done.length?'اكتمل الصعود':'تعذّر الصعود')+'</h2>'+
   '<p>'+(done.length?'اجتزت '+done.length+' '+word(done.length)+(win?'':' · الطابق التالي '+Math.min(S.floor,60)):'لم يُجتز أي طابق')+'</p>'+
   rch+'<div class="tw-grid">'+done.map(function(d,i){return '<div class="tw-tl'+(MS[d.f]?' ms':'')+'" style="--i:'+i+'"><b>'+d.f+'</b><span>'+esc(d.n)+' ⚔ '+L(d.p)+'</span></div>'}).join('')+'</div>'+
   (tot.length?'<div class="tw-tot">'+tot.map(function(t){return '<span>'+t+'</span>'}).join('')+'</div>':'')+
   (stop?'<div class="tw-err">⛔ '+esc(stop)+'</div>':'')+
   '<button id="tw-ok" type="button">متابعة</button>';
  $('#tw-res').classList.add('on');
  $('#tw-ok').onclick=function(){$('#tw-res').classList.remove('on')};
}

function climb(){
  if(S.busy||!S.sel.length||S.done)return;
  S.busy=true;
  var nums=S.sel.map(function(i){return C[i].no});
  S.sel=[];roster();
  fetch('/tower/climb',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({csrf:D.csrf,code:D.code,nums:nums})})
  .then(function(x){return x.json().catch(function(){return {ok:false,message:'خطأ بالخادم'}})})
  .catch(function(){return {ok:false,message:'تعذّر الاتصال بالخادم'}})
  .then(function(r){
    if(!r.ok){S.busy=false;toast(r.message||'حدث خطأ');autoPick(S.n);return}
    var chain=Promise.resolve();
    r.done.forEach(function(d){
      chain=chain.then(function(){return fight(d.f,d,true)}).then(function(){
        S.used[d.rn]=1;S.floor=d.f+1;if(d.f<=30)S.atk+=5;if(d.f===60)S.atk+=10;S.t+=d.r.draws;draw();return z(1200);
      });
    });
    if(r.fail)chain=chain.then(function(){return fight(r.fail.f,{n:r.fail.n,p:r.fail.p,need:r.fail.need},false)});
    return chain.then(function(){
      var st=r.st;
      S.floor=st.floor;S.atk=st.atk;S.t=st.tickets;S.done=st.completed;S.used={};
      st.used.forEach(function(n){S.used[n]=1});
      S.busy=false;S.fast=false;draw();
      showRes(r.done,r.stop,st.completed);
      S.done?(S.sel=[],roster()):autoPick(S.n);
    });
  });
}

$('#tw-roster').addEventListener('click',function(e){
  var b=e.target.closest('.tw-ch');if(!b||S.busy||S.done)return;
  var i=+b.dataset.i,k=S.sel.indexOf(i);
  if(k>-1)S.sel.splice(k,1);
  else if(S.sel.length<10&&S.floor+S.sel.length<=60)S.sel.push(i);
  roster();
});
$('#tw-seg').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||S.busy)return;
  [].forEach.call(document.querySelectorAll('#tw-seg button'),function(x){x.classList.toggle('on',x===b)});
  S.n=+b.dataset.n;autoPick(S.n);
});
$('#tw-clr').onclick=function(){if(S.busy)return;S.sel=[];roster()};
$('#tw-go').onclick=climb;
$('#tw-skip').onclick=function(){S.fast=true};
$('#tw-q').addEventListener('input',function(){S.q=this.value;shown=PAGE;roster()});
$('#tw-hide').onclick=function(){S.hide=!S.hide;this.classList.toggle('on',S.hide);roster()};
$('#tw-more').onclick=function(){shown+=PAGE;roster()};

draw();
setTimeout(function(){$('#tw-tower').classList.add('on')},60);
if(S.done){$('#tw-bar').style.display='none';roster()}else autoPick(1);
})();
</script>
